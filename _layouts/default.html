<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <meta name="theme-color" content="#0969da">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-canvas-default:   #ffffff;
      --color-canvas-subtle:    #f6f8fa;
      --color-border-default:   #d0d7de;
      --color-border-muted:     #d8dee4;
      --color-fg-default:       #1f2328;
      --color-fg-muted:         #656d76;
      --color-fg-subtle:        #6e7781;
      --color-accent-fg:        #0969da;
      --color-accent-emphasis:  #0969da;
      --color-accent-subtle:    #ddf4ff;
      --color-success-fg:       #1a7f37;
      --color-attention-subtle: #fff8c5;
      --color-done-fg:          #8250df;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 0 rgba(31,35,40,.04);
      --shadow-md: 0 3px 6px rgba(140,149,159,.15);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-fg-default);
      background: var(--color-canvas-default);
    }

    a { color: var(--color-accent-fg); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Header ─────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas-default);
      border-bottom: 1px solid var(--color-border-default);
      height: 56px;
      display: flex; align-items: center;
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto; padding: 0 24px;
      width: 100%; display: flex; align-items: center; gap: 16px;
    }
    .header-logo {
      font-weight: 700; font-size: 16px; color: var(--color-fg-default);
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
      text-decoration: none;
    }
    .header-logo:hover { text-decoration: none; color: var(--color-fg-default); }
    .header-logo svg { color: var(--color-fg-default); }
    .header-sep { color: var(--color-border-default); font-size: 20px; }
    .header-version {
      font-size: 12px; padding: 2px 8px; border-radius: 20px;
      background: var(--color-accent-subtle); color: var(--color-accent-fg);
      font-weight: 500; border: 1px solid #b6e3ff;
    }
    .header-search-wrap { flex: 1; max-width: 400px; }
    .header-search {
      width: 100%; padding: 6px 12px; border-radius: var(--radius-md);
      border: 1px solid var(--color-border-default);
      background: var(--color-canvas-subtle);
      font-size: 14px; color: var(--color-fg-default);
      outline: none;
    }
    .header-search:focus { border-color: var(--color-accent-emphasis); box-shadow: 0 0 0 3px rgba(9,105,218,.15); }
    .header-nav { display: flex; gap: 4px; margin-left: auto; }
    .header-nav a {
      font-size: 14px; padding: 6px 10px; border-radius: var(--radius-md);
      color: var(--color-fg-default); white-space: nowrap;
    }
    .header-nav a:hover { background: var(--color-canvas-subtle); text-decoration: none; }

    /* ── Page layout ────────────────────────── */
    .page-wrap {
      max-width: 1280px; margin: 0 auto; padding: 0 24px;
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: auto;
      gap: 0 40px;
      min-height: calc(100vh - 56px - 60px);
    }
    .page-wrap.no-sidebar { grid-template-columns: 1fr; }

    /* ── Sidebar ────────────────────────────── */
    .sidebar {
      padding: 24px 0;
      border-right: 1px solid var(--color-border-muted);
      position: sticky; top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }
    .sidebar-section { margin-bottom: 8px; }
    .sidebar-heading {
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--color-fg-muted);
      padding: 8px 16px 4px;
    }
    .sidebar-link {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 16px; font-size: 14px; border-radius: var(--radius-sm);
      color: var(--color-fg-default);
    }
    .sidebar-link:hover { background: var(--color-canvas-subtle); text-decoration: none; }
    .sidebar-link.active {
      background: var(--color-accent-subtle);
      color: var(--color-accent-fg); font-weight: 600;
    }
    .sidebar-icon { font-size: 15px; width: 20px; text-align: center; }

    /* ── Content ────────────────────────────── */
    .content { padding: 32px 0 64px; min-width: 0; }
    .content h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; line-height: 1.25; }
    .content h2 { font-size: 22px; font-weight: 600; margin: 32px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--color-border-muted); }
    .content h3 { font-size: 18px; font-weight: 600; margin: 24px 0 8px; }
    .content h4 { font-size: 16px; font-weight: 600; margin: 16px 0 6px; }
    .content p  { margin: 0 0 16px; }
    .content ul, .content ol { margin: 0 0 16px 24px; }
    .content li { margin-bottom: 6px; }
    .content blockquote {
      border-left: 4px solid var(--color-border-default);
      padding: 8px 16px; color: var(--color-fg-muted);
      margin: 0 0 16px; background: var(--color-canvas-subtle);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .content code {
      font-family: var(--font-mono); font-size: .875em;
      padding: 2px 6px; background: var(--color-canvas-subtle);
      border: 1px solid var(--color-border-muted); border-radius: var(--radius-sm);
    }
    .content pre {
      background: var(--color-canvas-subtle); border: 1px solid var(--color-border-muted);
      border-radius: var(--radius-md); padding: 16px; overflow-x: auto;
      margin: 0 0 16px;
    }
    .content pre code { background: none; border: none; padding: 0; font-size: 13px; }
    .content table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 14px; }
    .content th { background: var(--color-canvas-subtle); font-weight: 600; text-align: left; }
    .content th, .content td { padding: 8px 12px; border: 1px solid var(--color-border-muted); }
    .content tr:hover td { background: var(--color-canvas-subtle); }
    .content img { max-width: 100%; border-radius: var(--radius-md); }
    .content hr { border: none; border-top: 1px solid var(--color-border-muted); margin: 24px 0; }

    /* Lead description */
    .lead { font-size: 18px; color: var(--color-fg-muted); margin-bottom: 24px; }

    /* Breadcrumb */
    .breadcrumb { font-size: 13px; color: var(--color-fg-muted); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .breadcrumb a { color: var(--color-fg-muted); }
    .breadcrumb a:hover { color: var(--color-accent-fg); }
    .breadcrumb-sep { color: var(--color-border-default); }

    /* ── Hero (landing only) ────────────────── */
    .hero {
      background: linear-gradient(135deg, #f6f8fa 0%, #ffffff 60%);
      border-bottom: 1px solid var(--color-border-muted);
      padding: 48px 24px 40px;
      text-align: center;
    }
    .hero-inner { max-width: 700px; margin: 0 auto; }
    .hero-eyebrow {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--color-accent-fg);
      margin-bottom: 12px;
    }
    .hero h1 { font-size: 38px; font-weight: 800; line-height: 1.2; margin-bottom: 16px; }
    .hero-desc { font-size: 18px; color: var(--color-fg-muted); margin-bottom: 28px; }
    .hero-search-wrap { max-width: 560px; margin: 0 auto 28px; position: relative; }
    .hero-search {
      width: 100%; padding: 13px 16px 13px 44px;
      font-size: 16px; border-radius: var(--radius-lg);
      border: 1px solid var(--color-border-default);
      background: var(--color-canvas-default);
      box-shadow: var(--shadow-md); outline: none;
      color: var(--color-fg-default);
    }
    .hero-search:focus { border-color: var(--color-accent-emphasis); box-shadow: 0 0 0 3px rgba(9,105,218,.2); }
    .hero-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-fg-muted); pointer-events: none; }
    .hero-badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .hero-badge {
      font-size: 12px; padding: 4px 12px; border-radius: 20px;
      border: 1px solid var(--color-border-default); color: var(--color-fg-muted);
      background: var(--color-canvas-default);
    }
    .hero-badge.green { background: #dafbe1; border-color: #aceebb; color: var(--color-success-fg); }
    .hero-badge.blue  { background: var(--color-accent-subtle); border-color: #b6e3ff; color: var(--color-accent-fg); }
    .hero-badge.purple{ background: #fbefff; border-color: #e2c5ff; color: var(--color-done-fg); }

    /* ── Category cards ─────────────────────── */
    .section-wrap { max-width: 1280px; margin: 0 auto; padding: 48px 24px; }
    .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--color-fg-muted); margin-bottom: 16px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-bottom: 48px; }
    .card {
      border: 1px solid var(--color-border-default); border-radius: var(--radius-lg);
      padding: 20px; background: var(--color-canvas-default);
      transition: box-shadow .15s, border-color .15s;
      text-decoration: none; display: block; color: var(--color-fg-default);
    }
    .card:hover { box-shadow: var(--shadow-md); border-color: #b1bac4; text-decoration: none; }
    .card-icon { font-size: 28px; margin-bottom: 10px; display: block; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--color-fg-default); }
    .card-desc { font-size: 13px; color: var(--color-fg-muted); line-height: 1.5; }
    .card-arrow { font-size: 12px; color: var(--color-accent-fg); margin-top: 10px; display: block; }

    /* ── Featured links ─────────────────────── */
    .featured-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; margin-bottom: 48px; }
    .featured-group h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: .04em; }
    .featured-link {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      font-size: 14px; color: var(--color-accent-fg);
      border-bottom: 1px solid var(--color-border-muted);
    }
    .featured-link:last-child { border-bottom: none; }
    .featured-link:hover { text-decoration: underline; }
    .featured-link-icon { font-size: 13px; color: var(--color-fg-muted); }

    /* ── Callout ────────────────────────────── */
    .callout {
      display: flex; gap: 12px; padding: 16px; border-radius: var(--radius-md);
      margin-bottom: 16px; font-size: 14px; border: 1px solid;
    }
    .callout-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .callout.note { background: var(--color-accent-subtle); border-color: #b6e3ff; }
    .callout.warning { background: var(--color-attention-subtle); border-color: #e3b341; }
    .callout.tip { background: #dafbe1; border-color: #aceebb; }
    .callout-content { flex: 1; }
    .callout-content strong { display: block; margin-bottom: 4px; }

    /* ── Tags ───────────────────────────────── */
    .tag {
      display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 20px; border: 1px solid; margin-right: 4px; margin-bottom: 4px;
    }
    .tag-green  { background: #dafbe1; border-color: #aceebb; color: #1a7f37; }
    .tag-blue   { background: var(--color-accent-subtle); border-color: #b6e3ff; color: #0969da; }
    .tag-purple { background: #fbefff; border-color: #e2c5ff; color: #8250df; }
    .tag-orange { background: #fff1e5; border-color: #ffd8b5; color: #bc4c00; }

    /* ── Page meta ──────────────────────────── */
    .page-meta { font-size: 12px; color: var(--color-fg-muted); margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .page-meta-item { display: flex; align-items: center; gap: 4px; }

    /* ── Footer ─────────────────────────────── */
    footer {
      border-top: 1px solid var(--color-border-muted);
      background: var(--color-canvas-subtle);
      padding: 24px;
      font-size: 13px; color: var(--color-fg-muted);
    }
    .footer-inner { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .footer-links { display: flex; gap: 16px; }
    .footer-links a { color: var(--color-fg-muted); }
    .footer-links a:hover { color: var(--color-accent-fg); }

    /* ── Responsive ─────────────────────────── */
    @media (max-width: 768px) {
      .page-wrap { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .hero h1 { font-size: 28px; }
      .header-nav { display: none; }
      .header-search-wrap { display: none; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="header-logo">
      <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>

</html>
